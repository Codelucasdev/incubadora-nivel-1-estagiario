<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encontre as melhores ofertas em eletrônicos, periféricos e muito mais. Compre com os melhores preços!"
    />
    <meta
      name="keywords"
      content="e-commerce, eletrônicos, ofertas, compras online"
    />
    <meta name="author" content="E-commerce" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="E-commerce - As Melhores Ofertas em Tecnologia"
    />
    <meta
      property="og:description"
      content="Encontre as melhores ofertas em eletrônicos, periféricos e muito mais"
    />

    <title>E-commerce - Home | As Melhores Ofertas em Tecnologia</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <!-- Header / Navigation -->
    <header class="header">
      <div class="header__container">
        <!-- Logo -->
        <a href="index.html" class="header__logo">
          <svg
            class="header__logo-icon"
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="40" height="40" rx="8" fill="currentColor" />
            <path
              d="M12 20L18 26L28 14"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>TechShop</span>
        </a>
      </div>
    </header>
    <main class="main-content">
      <h2>Rastrear Pedido</h2>
      <form action="index.html">
        <div class="form-group">
          <label for="Codigo">Código do Pedido</label>
          <input
            type="text"
            id="Codigo"
            placeholder="Digite o código de envio"
          />
        </div>
        <button type="submit" class="button">Rastrear</button>
      </form>

      <div id="tracking-result" style="display: none">
        <h3>Status do Pedido</h3>
        <p>Aguardando atualização de envio</p>
        <a href="#">Precisa de ajuda com o pedido?</a>
      </div>
    </main>
  </body>
</html>
